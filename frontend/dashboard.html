<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CRM Dev - Dashboard</title>


    <!-- Favicon -->

    <link
        rel="icon"
        type="image/x-icon"
        href="images/favicon.ico"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

</head>


<body>


    <!-- Navigation -->

    <header>

        <nav class="navbar">


            <div class="logo-container">

                <img
                    src="images/logo.png"
                    alt="CRM Dev Logo"
                    class="logo"
                >

                <span>
                    CRM Dev
                </span>

            </div>


            <div class="nav-links">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="index.html">
                    Home
                </a>

                <button
                    id="logoutButton"
                >
                    Logout
                </button>

            </div>


        </nav>

    </header>


    <!-- Dashboard -->

    <main class="dashboard-container">


        <h1>
            CRM Dashboard
        </h1>


        <p>
            Welcome to CRM Dev Dashboard
        </p>


        <!-- Dashboard Cards -->

        <div class="dashboard-cards">


            <div class="dashboard-card">

                <h3>
                    Total Users
                </h3>

                <p id="totalUsers">
                    0
                </p>

            </div>


            <div class="dashboard-card">

                <h3>
                    Total Products
                </h3>

                <p id="totalProducts">
                    0
                </p>

            </div>


            <div class="dashboard-card">

                <h3>
                    Total Orders
                </h3>

                <p id="totalOrders">
                    0
                </p>

            </div>


        </div>


    </main>


    <!-- JavaScript -->

    <script src="js/main.js"></script>

    <script src="js/dashboard.js"></script>


</body>

</html>
