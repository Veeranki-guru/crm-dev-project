{% extends "base.html" %}


{% block title %}

Login

{% endblock %}


{% block extra_css %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/login.css') }}"
>

{% endblock %}


{% block content %}

<div class="login-container">


    <!-- Logo -->

    <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        alt="Application Logo"
        class="logo"
    >


    <h2>
        Login
    </h2>


    <!-- Error Message -->

    <div
        id="errorMessage"
        class="error-message"
    >

        {% if error %}

            {{ error }}

        {% endif %}

    </div>


    <!-- Login Form -->

    <form
        id="loginForm"
        method="POST"
        action="/auth/login"
    >


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-button"
        >

            Login

        </button>


    </form>

</div>

{% endblock %}


{% block extra_js %}

<script
    src="{{ url_for('static', filename='js/login.js') }}">
</script>

{% endblock %}
