<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Flask Application
        {% endblock %}
    </title>


    <!-- Favicon -->

    <link
        rel="icon"
        type="image/x-icon"
        href="{{ url_for('static', filename='images/favicon.ico') }}"
    >


    <!-- Common CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >


    <!-- Page-specific CSS -->

    {% block extra_css %}
    {% endblock %}

</head>


<body>


    <!-- Navigation -->

    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="/auth/login">
            Login
        </a>

        <a href="/dashboard">
            Dashboard
        </a>

    </nav>


    <!-- Main Content -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- Common JavaScript -->

    <script
        src="{{ url_for('static', filename='js/main.js') }}">
    </script>


    <!-- Page-specific JavaScript -->

    {% block extra_js %}
    {% endblock %}


</body>

</html>
